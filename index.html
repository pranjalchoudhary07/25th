  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#722525" />
  <meta name="robots" content="noindex" />
  <title>A Little Love Note</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 58'%3E%3Cpath d='M32 56C10 40 2 28 2 17 2 8 9 2 17 2c6 0 11 3 15 9 4-6 9-9 15-9 8 0 15 6 15 15 0 11-8 23-30 39z' fill='%23cc5e52'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ SVG STICKER / DOODLE SPRITE ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="s-heart" viewBox="0 0 64 58">
        <path d="M32 56 C10 40 2 28 2 17 2 8 9 2 17 2 c6 0 11 3 15 9 4-6 9-9 15-9 8 0 15 6 15 15 0 11-8 23-30 39z" fill="currentColor"/>
        <path d="M13 12 c-3 2-4 5-4 8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
      </symbol>
      <symbol id="s-heart-outline" viewBox="0 0 64 58">
        <path d="M32 54 C11 39 4 28 4 18 4 9 10 4 17 4 c6 0 11 4 15 10 4-6 9-10 15-10 8 0 13 6 13 14 0 10-7 21-28 36z" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-star" viewBox="0 0 60 60">
        <path d="M30 3 l7.5 17.5 18.5 1.5 -14 12.5 4.5 18.5 -16.5 -10 -16.5 10 4.5 -18.5 -14 -12.5 18.5 -1.5z" fill="currentColor" stroke="#3c3333" stroke-width="2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-sparkle" viewBox="0 0 40 40">
        <path d="M20 2 C21 14 26 19 38 20 26 21 21 26 20 38 19 26 14 21 2 20 14 19 19 14 20 2z" fill="currentColor"/>
      </symbol>
      <symbol id="s-bow" viewBox="0 0 100 70">
        <path d="M50 30 C35 8 8 2 6 18 4 34 30 40 50 34z" fill="currentColor" stroke="#3c3333" stroke-width="2"/>
        <path d="M50 30 C65 8 92 2 94 18 96 34 70 40 50 34z" fill="currentColor" stroke="#3c3333" stroke-width="2"/>
        <path d="M46 34 L30 66 42 60 48 68 52 38z M54 34 L70 66 58 60 52 68 48 38z" fill="currentColor" stroke="#3c3333" stroke-width="2" stroke-linejoin="round"/>
        <ellipse cx="50" cy="32" rx="8" ry="9" fill="currentColor" stroke="#3c3333" stroke-width="2"/>
        <path d="M20 16 q8 2 16 10 M80 16 q-8 2 -16 10" stroke="#3c3333" stroke-width="1.5" fill="none" opacity=".4"/>
      </symbol>
      <symbol id="s-flower" viewBox="0 0 60 60">
        <g fill="currentColor" stroke="#3c3333" stroke-width="1.8">
          <circle cx="30" cy="13" r="11"/><circle cx="46" cy="25" r="11"/><circle cx="40" cy="44" r="11"/>
          <circle cx="20" cy="44" r="11"/><circle cx="14" cy="25" r="11"/>
        </g>
        <circle cx="30" cy="30" r="8" fill="#f4c86a" stroke="#3c3333" stroke-width="1.8"/>
      </symbol>
      <symbol id="s-cherry" viewBox="0 0 60 64">
        <path d="M18 40 C22 22 30 10 44 4 M42 42 C40 26 40 14 44 4" stroke="#4a6b3a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M44 4 c6 2 12 0 14 -2 -2 8 -10 10 -14 2z" fill="#6b8f4e"/>
        <circle cx="16" cy="48" r="13" fill="#b3261e" stroke="#3c3333" stroke-width="2"/>
        <circle cx="42" cy="50" r="12" fill="#b3261e" stroke="#3c3333" stroke-width="2"/>
        <path d="M10 44 q2 -4 6 -5 M37 46 q2 -4 5 -4" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
      </symbol>
      <symbol id="s-envelope" viewBox="0 0 70 50">
        <rect x="3" y="3" width="64" height="44" rx="4" fill="#faf4e9" stroke="#3c3333" stroke-width="2.5"/>
        <path d="M5 6 L35 28 65 6" fill="none" stroke="#3c3333" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M35 34 c-6-5-9-8-9-11 0-2 2-4 4-4 2 0 4 1 5 3 1-2 3-3 5-3 2 0 4 2 4 4 0 3-3 6-9 11z" fill="#cc5e52"/>
      </symbol>
      <symbol id="s-stamp" viewBox="0 0 80 96">
        <path d="M4 4 h72 v88 h-72z" fill="#faf4e9" stroke="#3c3333" stroke-width="2" stroke-dasharray="5 3"/>
        <rect x="12" y="12" width="56" height="62" fill="currentColor" opacity=".9"/>
        <path d="M40 60 c-12-9-17-15-17-21 0-5 4-8 8-8 4 0 7 2 9 6 2-4 5-6 9-6 4 0 8 3 8 8 0 6-5 12-17 21z" fill="#faf4e9"/>
        <text x="40" y="88" text-anchor="middle" font-family="Courier Prime, monospace" font-size="10" fill="#3c3333">LOVE · 25</text>
      </symbol>
      <symbol id="s-squiggle" viewBox="0 0 120 20">
        <path d="M2 12 q10 -12 20 0 t20 0 t20 0 t20 0 t20 0 t16 -2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="s-arrow" viewBox="0 0 100 60">
        <path d="M4 50 C20 10 60 4 88 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M76 8 L90 18 76 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-loop" viewBox="0 0 120 50">
        <path d="M4 40 C30 40 30 8 48 10 66 12 54 40 40 34 28 28 50 6 72 18 90 28 100 36 116 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="s-music" viewBox="0 0 24 24">
        <path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/>
      </symbol>
      <symbol id="s-pause" viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1.5" fill="currentColor"/>
      </symbol>
      <symbol id="s-chev-left" viewBox="0 0 24 24">
        <path d="M15 4 L7 12 15 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-chev-right" viewBox="0 0 24 24">
        <path d="M9 4 L17 12 9 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-close" viewBox="0 0 24 24">
        <path d="M5 5 L19 19 M19 5 L5 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="s-backspace" viewBox="0 0 28 24">
        <path d="M9 3 h15 a2 2 0 0 1 2 2 v14 a2 2 0 0 1 -2 2 h-15 l-7 -9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M13 8 l7 8 M20 8 l-7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <symbol id="s-lock" viewBox="0 0 40 48">
        <path d="M10 20 v-7 a10 10 0 0 1 20 0 v7" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <rect x="4" y="20" width="32" height="25" rx="6" fill="currentColor"/>
        <path d="M20 38 c-5-4-7-6-7-9 0-2 1.5-3.5 3.5-3.5 1.6 0 2.8 0.8 3.5 2.2 0.7-1.4 1.9-2.2 3.5-2.2 2 0 3.5 1.5 3.5 3.5 0 3-2 5-7 9z" fill="#faf4e9"/>
      </symbol>
      <symbol id="s-shuffle" viewBox="0 0 24 24">
        <path d="M3 7h3c4 0 6 10 10 10h4M17 14l3 3-3 3M3 17h3c1.5 0 2.6-1.4 3.6-3M13.4 10c1-1.6 2.1-3 3.6-3h3M17 4l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="s-mic" viewBox="0 0 24 24">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
      <!-- paper grain used by CSS via filter -->
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
      </filter>
    </defs>
  </svg>

  <!-- ============ FLOATING BACKGROUND HEARTS ============ -->
  <div class="floaties" id="floaties" aria-hidden="true"></div>

  <!-- ============ LOCK SCREEN ============ -->
  <main class="lock" id="lock" aria-label="Locked. Enter the passcode.">
    <div class="lock__inner">
      <div class="tape tape--pink lock__tape" aria-hidden="true"></div>
      <svg class="sticker lock__bow" aria-hidden="true"><use href="#s-bow"/></svg>
      <svg class="lock__icon" aria-hidden="true"><use href="#s-lock"/></svg>
      <p class="lock__eyebrow" data-text="lock.eyebrow"></p>
      <h1 class="lock__title script" data-text="lock.title"></h1>

      <div class="lock__dots" id="lockDots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="lock__msg" id="lockMsg" role="status" aria-live="polite">&nbsp;</p>

      <div class="keypad" id="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <span class="key key--blank" aria-hidden="true"></span>
        <button class="key" data-key="0">0</button>
        <button class="key key--del" data-key="del" aria-label="Delete last digit">
          <svg aria-hidden="true"><use href="#s-backspace"/></svg>
        </button>
      </div>

      <p class="lock__hint hand" data-text="lock.hint"></p>
    </div>
  </main>

  <!-- ============ THE SCRAPBOOK ============ -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <span class="topbar__title hand" id="pageLabel"></span>
      <button class="icon-btn" id="musicBtn" aria-label="Play music" aria-pressed="false">
        <svg aria-hidden="true"><use href="#s-music"/></svg>
      </button>
    </header>

    <div class="book" id="book" aria-roledescription="scrapbook" aria-live="polite">

      <!-- 1. COVER -->
      <section class="page page--cover" data-title="Cover">
        <div class="page__scroll page__scroll--center">
          <div class="tape tape--stripe" style="--x:8%;--y:4%;--r:-22deg"></div>
          <div class="tape tape--dots" style="--x:62%;--y:3%;--r:18deg"></div>
          <svg class="sticker" style="--x:6%;--y:16%;--w:54px;--r:-14deg;color:#cc5e52"><use href="#s-heart"/></svg>
          <svg class="sticker sticker--twinkle" style="--x:82%;--y:14%;--w:34px;color:#f4c86a"><use href="#s-star"/></svg>
          <svg class="sticker" style="--x:78%;--y:78%;--w:58px;--r:12deg;color:#e8a3a0"><use href="#s-flower"/></svg>
          <svg class="sticker" style="--x:6%;--y:80%;--w:46px;--r:-8deg"><use href="#s-cherry"/></svg>

          <p class="cover__eyebrow type" data-text="cover.eyebrow"></p>
          <h2 class="cover__title">
            <span class="script" data-text="cover.line1"></span>
            <span class="cover__num" data-text="age"></span>
            <span class="script" data-text="cover.line2"></span>
            <span class="cover__name hand" data-text="hisName"></span>
          </h2>
          <p class="bday-date type" data-text="birthday"></p>

          <figure class="polaroid cover__photo" style="--r:-4deg">
            <div class="tape tape--kraft tape--top"></div>
            <img data-img="cover.photo" alt="" />
            <figcaption class="hand" data-text="cover.caption"></figcaption>
          </figure>

          <button class="cover__open hand" id="coverOpen">
            <span data-text="cover.tapPrompt"></span>
            <svg aria-hidden="true"><use href="#s-chev-right"/></svg>
          </button>
          <p class="cover__from type" data-text="cover.from"></p>
        </div>
      </section>

      <!-- 2. HOW WE MET -->
      <section class="page page--grid" data-title="How We Met">
        <div class="page__scroll">
          <h2 class="page__heading script" data-text="howWeMet.title"></h2>
          <svg class="doodle" style="--x:58%;--y:6%;--w:90px;color:#cc5e52"><use href="#s-squiggle"/></svg>

          <figure class="polaroid polaroid--big" style="--r:3deg">
            <div class="tape tape--pink tape--corner-l"></div>
            <div class="tape tape--pink tape--corner-r"></div>
            <img data-img="howWeMet.photo" alt="" />
            <figcaption class="hand" data-text="howWeMet.photoCaption"></figcaption>
          </figure>

          <div class="note-card">
            <p class="note-card__meta type">
              <span data-text="howWeMet.date"></span> · <span data-text="howWeMet.place"></span>
            </p>
            <p class="note-card__body" data-text="howWeMet.story"></p>
            <svg class="sticker" style="--x:84%;--y:-18px;--w:40px;--r:14deg;color:#cc5e52"><use href="#s-heart"/></svg>
          </div>
        </div>
      </section>

      <!-- 3. TIMELINE -->
      <section class="page page--kraft" data-title="Our Timeline">
        <div class="page__scroll">
          <h2 class="page__heading script" data-text="timeline.title"></h2>
          <p class="page__sub hand" data-text="timeline.subtitle"></p>
          <ol class="timeline" id="timeline"></ol>
          <svg class="sticker" style="--x:80%;--y:2%;--w:44px;--r:10deg"><use href="#s-stamp" style="color:#cc5e52"/></svg>
        </div>
      </section>

      <!-- 4. PHOTO WALL -->
      <section class="page page--cork" data-title="Photo Wall">
        <div class="page__scroll">
          <h2 class="page__heading script page__heading--light" data-text="photoWall.title"></h2>
          <p class="page__sub hand page__sub--light" data-text="photoWall.subtitle"></p>
          <div class="wall" id="wall"></div>
        </div>
      </section>

      <!-- 5. 25 REASONS -->
      <section class="page page--pink" data-title="25 Reasons">
        <div class="page__scroll">
          <h2 class="page__heading script" data-text="reasons.title"></h2>
          <p class="page__sub hand" data-text="reasons.subtitle"></p>

          <div class="reason-viewer" id="reasonViewer" aria-live="polite">
            <div class="tape tape--stripe tape--top"></div>
            <span class="reason-viewer__num type" id="reasonNum">♡</span>
            <p class="reason-viewer__text hand" id="reasonText"></p>
          </div>

          <div class="reasons-bar">
            <span class="type" id="reasonCount">0 / 25 found</span>
            <button class="btn btn--small" id="reasonShuffle">
              <svg aria-hidden="true"><use href="#s-shuffle"/></svg>
              <span data-text="reasons.shuffleLabel"></span>
            </button>
          </div>

          <div class="reasons" id="reasons"></div>
        </div>
      </section>

      <!-- 6. FAVORITE THINGS -->
      <section class="page page--grid" data-title="Favorite Things">
        <div class="page__scroll">
          <h2 class="page__heading script" data-text="favorites.title"></h2>
          <p class="page__sub hand" data-text="favorites.subtitle"></p>
          <div class="tickets" id="tickets"></div>
          <svg class="sticker sticker--twinkle" style="--x:86%;--y:3%;--w:30px;color:#f4c86a"><use href="#s-sparkle"/></svg>
        </div>
      </section>

      <!-- 7. OPEN WHEN -->
      <section class="page page--pink" data-title="Open When">
        <div class="page__scroll">
          <h2 class="page__heading script" data-text="openWhen.title"></h2>
          <p class="page__sub hand" data-text="openWhen.subtitle"></p>
          <div class="envelopes" id="envelopes"></div>
        </div>
      </section>

      <!-- 8. LETTER -->
      <section class="page page--cream" data-title="A Letter">
        <div class="page__scroll">
          <div class="letter">
            <div class="tape tape--dots tape--top"></div>
            <svg class="sticker" style="--x:84%;--y:-14px;--w:46px;--r:12deg;color:#cc5e52"><use href="#s-stamp"/></svg>
            <p class="letter__date type" data-text="letter.date"></p>
            <p class="letter__greeting hand" data-text="letter.greeting"></p>
            <div class="letter__body hand" id="letterBody"></div>
            <p class="letter__sign hand" data-text="letter.signOff"></p>
            <p class="letter__name script" data-text="letter.signature"></p>
          </div>
        </div>
      </section>

      <!-- 9. MAKE A WISH -->
      <section class="page page--night" data-title="Make a Wish">
        <div class="page__scroll page__scroll--center">
          <h2 class="page__heading script page__heading--light" data-text="wish.title"></h2>
          <p class="bday-date bday-date--light type" data-text="birthday"></p>
          <p class="page__sub hand page__sub--light" id="wishPrompt" data-text="wish.prompt"></p>

          <button class="cake" id="cake" aria-label="Tap to blow out the candles">
            <span class="candles">
              <span class="candle candle--2"><span class="num">2</span><span class="flame"></span><span class="smoke"></span></span>
              <span class="candle candle--5"><span class="num">5</span><span class="flame"></span><span class="smoke"></span></span>
            </span>
            <span class="cake__top"></span>
            <span class="cake__tier cake__tier--1"><span class="cake__drip"></span></span>
            <span class="cake__tier cake__tier--2"><span class="cake__drip"></span></span>
            <span class="cake__plate"></span>
          </button>

          <p class="wish-done script" id="wishDone" data-text="wish.doneMessage" hidden></p>
          <div class="wish-actions">
            <button class="btn btn--light" id="micBtn">
              <svg aria-hidden="true"><use href="#s-mic"/></svg>
              <span data-text="wish.micLabel"></span>
            </button>
            <button class="btn btn--ghost" id="relightBtn" hidden data-text="wish.relightLabel"></button>
          </div>
        </div>
      </section>

      <!-- 10. FINAL -->
      <section class="page page--cover" data-title="The End">
        <div class="page__scroll page__scroll--center">
          <div class="tape tape--stripe" style="--x:60%;--y:3%;--r:14deg"></div>
          <svg class="sticker sticker--twinkle" style="--x:8%;--y:8%;--w:32px;color:#f4c86a"><use href="#s-star"/></svg>
          <svg class="sticker" style="--x:80%;--y:84%;--w:52px;--r:-10deg;color:#cc5e52"><use href="#s-heart"/></svg>

          <h2 class="final__title">
            <span class="script" data-text="final.line1"></span>
            <span class="hand final__big" data-text="final.line2"></span>
          </h2>
          <figure class="polaroid polaroid--big" style="--r:-3deg">
            <div class="tape tape--kraft tape--top"></div>
            <img data-img="final.photo" alt="" />
            <figcaption class="hand" data-text="final.caption"></figcaption>
          </figure>
          <p class="final__msg" data-text="final.message"></p>
          <button class="btn" id="restartBtn">
            <svg aria-hidden="true"><use href="#s-heart"/></svg>
            <span data-text="final.restartLabel"></span>
          </button>
        </div>
      </section>
    </div>

    <nav class="nav" aria-label="Scrapbook pages">
      <button class="nav__btn" id="prevBtn" aria-label="Previous page">
        <svg aria-hidden="true"><use href="#s-chev-left"/></svg>
      </button>
      <div class="nav__mid">
        <span class="nav__count type" id="pageCount">1 / 10</span>
        <div class="nav__dots" id="navDots" aria-hidden="true"></div>
      </div>
      <button class="nav__btn" id="nextBtn" aria-label="Next page">
        <svg aria-hidden="true"><use href="#s-chev-right"/></svg>
      </button>
      <p class="nav__hint hand" data-text="closedBookHint" aria-hidden="true"></p>
    </nav>
  </div>

  <!-- ============ OVERLAYS ============ -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo">
    <button class="icon-btn lightbox__close" id="lbClose" aria-label="Close photo">
      <svg aria-hidden="true"><use href="#s-close"/></svg>
    </button>
    <figure class="polaroid lightbox__card">
      <img id="lbImg" alt="" />
      <figcaption class="hand" id="lbCap"></figcaption>
    </figure>
    <div class="lightbox__nav">
      <button class="icon-btn" id="lbPrev" aria-label="Previous photo"><svg aria-hidden="true"><use href="#s-chev-left"/></svg></button>
      <button class="icon-btn" id="lbNext" aria-label="Next photo"><svg aria-hidden="true"><use href="#s-chev-right"/></svg></button>
    </div>
  </div>

  <div class="note-modal" id="noteModal" hidden role="dialog" aria-modal="true" aria-labelledby="noteTitle">
    <div class="note-modal__paper">
      <div class="tape tape--pink tape--top"></div>
      <button class="icon-btn note-modal__close" id="noteClose" aria-label="Close note">
        <svg aria-hidden="true"><use href="#s-close"/></svg>
      </button>
      <h3 class="note-modal__title script" id="noteTitle"></h3>
      <div class="note-modal__body hand" id="noteBody"></div>
    </div>
  </div>

  <div class="toast hand" id="toast" role="status" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
  <audio id="bgMusic" preload="none" loop></audio>

  <script src="script.js"></script>
</body>
</html>
